<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riwayat — Timbang</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js" defer></script>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>TIMBANG</h1>
  <nav><a href="/">Sidang baru</a><a href="/riwayat">Riwayat</a><a href="/setting">Setting</a><button id="tema" class="tema" type="button">☾ gelap</button></nav>
</div></header>

<div class="wrap">
  <h2>Riwayat sidang</h2>
  <p class="muted">Daftar sidang, config yang dipakai, dan kolom diagnostik. Tidak ada angka
  kemenangan di sini — yang diukur perilaku sistem, bukan siapa yang unggul.</p>
  <div id="isi"><div class="notice">memuat…</div></div>
</div>

<script>
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
async function load() {
  const r = await fetch('/api/riwayat');
  const list = await r.json();
  const isi = document.getElementById('isi');
  if (!list.length) { isi.innerHTML = '<div class="notice">Belum ada sidang. <a href="/">Mulai satu.</a></div>'; return; }
  let html = `<table><thead><tr>
    <th>Topik / klaim</th><th>Status</th><th>Pro vs Kontra</th>
    <th>Ronde</th><th>Turn</th><th>Bertanda</th>
    <th title="klaim tak pernah dijawab / total klaim terlacak — rasio tinggi di semua sesi berarti fase rebuttal kurang mengikat (§8)">Klaim sepi</th>
    <th title="ringkasan fact-check klaim faktual: terdukung ✓ / diragukan ⚠ / tak-terverifikasi ? · agregat total, bukan per-sisi (§10)">Fakta</th>
    <th>Mulai</th></tr></thead><tbody>`;
  list.forEach(s => {
    const sepi = (s.klaim_total ? `${s.klaim_sepi}/${s.klaim_total}` : '—');
    // Fact-check aggregate. Deliberately not "Pro N%, Kontra M%" — that would
    // read like a score, which §10 forbids. Just the counts across all
    // faktual claims, so the reader can see whether the topic is grounded in
    // checkable facts at all (fakta_total near zero → mostly opini).
    let fakta = '—';
    if (s.fakta_total) {
      fakta = `${s.fakta_terdukung}✓ ${s.fakta_diragukan}⚠ ${s.fakta_takterverifikasi}? / ${s.fakta_total}`;
    }
    html += `<tr>
      <td><a href="/sesi/${s.id}">${esc(s.klaim || s.topik)}</a></td>
      <td><span class="tag">${esc(s.status_label)}</span></td>
      <td><code>${esc(s.pro)}</code> vs <code>${esc(s.kontra)}</code></td>
      <td>${s.rounds}</td>
      <td>${s.turns}</td>
      <td>${s.turns_bertanda}</td>
      <td class="${s.klaim_sepi ? 'sepi' : ''}">${sepi}</td>
      <td class="fakta">${fakta}</td>
      <td>${esc((s.created_at||'').slice(0,16).replace('T',' '))}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  isi.innerHTML = html;
}
load();
</script>
</body>
</html>
