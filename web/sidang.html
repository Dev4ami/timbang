<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidang — Timbang</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js" defer></script>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>TIMBANG</h1>
  <nav><a href="/">Sidang baru</a><a href="/riwayat">Riwayat</a><a href="/setting">Setting</a><button id="tema" class="tema" type="button">☾ gelap</button></nav>
</div></header>

<div class="wrap">
  <div id="head"></div>
  <div id="fasestrip" class="fasestrip"></div>
  <div id="klaimpanel"></div>
  <div id="body"><div class="notice">memuat…</div></div>

  <details class="panel" id="panelsintesis">
    <summary>Sintesis &amp; crux — dibuka manual</summary>
    <div id="sintesisisi"></div>
  </details>
</div>

<!-- One persistent player, deliberately OUTSIDE #body so a live turn re-render
     (SSE) never destroys it — that was the bug where playing audio cut out. It
     also lets one turn keep playing while another is being generated. -->
<div id="playerbar" hidden>
  <span id="playerlabel" class="playerlabel"></span>
  <audio id="player" controls></audio>
  <button id="playerclose" class="audiobtn" type="button" onclick="tutupPlayer()">tutup</button>
</div>

<script>
const id = location.pathname.split('/')[2];
const FASE = ['Framing','Opening','Rebuttal','Cross-exam: bertanya','Cross-exam: menjawab','Crux','Fact-check','Sintesis','Selesai'];
const turns = new Map();   // index -> turn
let meta = null;
let claims = [];           // full claim list, server-ordered (unanswered first)

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

function head() {
  const h = document.getElementById('head');
  const klaim = meta.klaim || meta.topik;
  h.innerHTML = `<div class="klaim">${esc(klaim)}</div>
    <div class="meta">
      <span class="status-pill status-${meta.status}">${esc(meta.status_label)}</span>
      <span>Pro <code>${esc(meta.models.pro)}</code></span>
      <span>Kontra <code>${esc(meta.models.kontra)}</code></span>
      <span>${meta.rounds} ronde</span>
    </div>`;
  const strip = document.getElementById('fasestrip');
  const active = new Set([...turns.values()].map(t => t.phase));
  // Fact-check produces no turns (hasilnya ke Claim, bukan Turn), jadi
  // deteksinya lewat verdict — kalau ada klaim ber-verdict, fase Fact-check
  // sudah/sedang jalan.
  if (claims.some(c => c.verdict_key || c.kind_key === 'opini')) {
    active.add('Fact-check');
  }
  // Selesai never emits a turn, so it can only be lit from status. The debate
  // reaches this state after Crux+Fact-check, before synthesis is run by hand.
  if (meta.status === 'selesai') { active.add('Selesai'); }
  strip.innerHTML = FASE.map(f => `<span class="${active.has(f)?'on':''}">${f}</span>`).join('');
}

function renderKlaim() {
  const el = document.getElementById('klaimpanel');
  if (!claims.length) { el.innerHTML = ''; return; }

  // Unanswered claims lead and are marked hardest (§3, §7): the whole reason
  // this tool exists is to surface what nobody ever answered, so it outranks
  // what was resolved — the inversion of the usual habit of leading with
  // settled things. Abandoned claims (a side dropping its own argument) get
  // their own loud mark; neither is a score, and there is no winner count here.
  const sepi = claims.filter(c => c.unanswered);
  const lain = claims.filter(c => !c.unanswered);

  let html = `<details class="klaim" open><summary>Status klaim
    <span class="kbadge">${sepi.length} tak dijawab · ${claims.length} total</span></summary>`;

  if (sepi.length) {
    html += `<div class="ksection ksepi"><div class="khead">⚑ Tidak pernah dijawab</div>`;
    sepi.forEach(c => { html += krow(c); });
    html += `</div>`;
  }
  if (lain.length) {
    html += `<div class="ksection"><div class="khead">Sudah ditanggapi</div>`;
    lain.forEach(c => { html += krow(c); });
    html += `</div>`;
  }
  html += `</details>`;
  el.innerHTML = html;
}

function krow(c) {
  // Fact-check badge (Tahap 4). Rendered as a small chip on the id side so it
  // reads at a glance without pushing the claim text off the row. §1 forbids
  // treating this as a winner signal — the badge flags "check this yourself",
  // and the tooltip carries the fact-checker's short catatan for that reason.
  //   faktual + terdukung  = ✓ green
  //   faktual + diragukan  = ⚠ amber (loud — this is the one worth acting on)
  //   faktual + tak-terverifikasi = ? grey (honest "I don't know")
  //   opini = · grey (fact-check has nothing to say about a value judgement)
  //   belum diperiksa = no badge (silence is honest before the pass runs)
  let fc = '';
  if (c.verdict_key) {
    const mark = c.verdict_key === 'terdukung' ? '✓'
               : c.verdict_key === 'diragukan' ? '⚠'
               : '?';
    const tip = c.fact_catatan ? esc(c.fact_catatan) : esc(c.verdict_label);
    fc = `<span class="fbadge fb-${c.verdict_key}" title="${tip}">${mark} ${esc(c.verdict_label)}</span>`;
  } else if (c.kind_key === 'opini') {
    fc = `<span class="fbadge fb-opini" title="Klaim penilaian nilai — bukan fakta yang bisa diperiksa">· opini</span>`;
  } else if (c.kind_key === 'faktual') {
    fc = `<span class="fbadge fb-belum" title="Faktual tapi belum diperiksa">faktual · belum</span>`;
  }

  return `<div class="krow k-${c.side} kst-${c.status}">
    <span class="kid">${esc(c.id)}</span>
    <span class="kside">${esc(c.owner_label)}</span>
    <span class="ktext">${esc(c.text)}</span>
    ${fc}
    <span class="kstatus">${esc(c.status_label)}</span></div>`;
}

function render() {
  head();
  renderKlaim();
  renderPanel();
  const body = document.getElementById('body');
  // Synthesis is kept OUT of the transcript stream on purpose (§1): it lives
  // only in the manual panel below, never at the top of the record. Filtering
  // here rather than server-side keeps the from-disk and live views identical.
  const list = [...turns.values()].filter(t => t.side !== 'sintesis').sort((a,b) => a.index - b.index);
  if (!list.length) { body.innerHTML = '<div class="notice">menunggu giliran pertama…</div>'; return; }

  // Group consecutive turns by (phase, round). Moderator/sintesis render full
  // width; debaters split into two opposing columns.
  let html = '', curKey = null;
  const groups = [];
  list.forEach(t => {
    if (t.phase_key !== curKey) { groups.push({ key: t.phase_key, phase: t.phase, round: t.round, per: t.per_ronde, turns: [] }); curKey = t.phase_key; }
    groups[groups.length-1].turns.push(t);
  });

  groups.forEach(g => {
    const title = g.per ? `${g.phase} · ronde ${g.round}` : g.phase;
    html += `<section class="fase"><h3>${esc(title)}</h3>`;
    const full = g.turns.filter(t => t.side==='moderator');
    const pro = g.turns.filter(t => t.side==='pro');
    const kontra = g.turns.filter(t => t.side==='kontra');
    full.forEach(t => html += card(t, 'full'));
    if (pro.length || kontra.length) {
      html += `<div class="cols">
        <div class="col pro"><div class="colhead">PRO</div>${pro.map(t=>card(t,'pro')).join('')}</div>
        <div class="col kontra"><div class="colhead">KONTRA</div>${kontra.map(t=>card(t,'kontra')).join('')}</div>
      </div>`;
    }
    html += `</section>`;
  });

  // An explicit end marker so a finished debate does not read as truncated.
  // Argument ends at Crux; fact-check runs after but produces no turns (it
  // writes to Claims — see the badges in the status panel). Synthesis is
  // deliberately not run yet (§1: no summary before the transcript has been
  // read), so the last visible phase is still Crux.
  if (meta.status === 'selesai') {
    html += `<div class="endmark">◆ Debat selesai — argumen berhenti di Crux.
      Fact-check klaim ada di panel status klaim. Buka panel Sintesis di bawah untuk menjalankannya.</div>`;
  } else if (meta.status === 'gagal') {
    html += `<div class="endmark gagal">■ Sesi berhenti di tengah. Transkrip sampai sini aman;
      sesi bisa dilanjutkan.</div>`;
  }
  body.innerHTML = html;
}

function card(t, cls) {
  let w = '';
  if (t.provenance_warning) w += `<div class="warn">⚠ ${esc(t.provenance_warning)}</div>`;
  (t.flags||[]).forEach(f => w += `<div class="flag">⚑ ${esc(f)}</div>`);

  // Attack chip (§7): a rebuttal that names an opposing claim it engaged, or —
  // just as loudly — the absence of any. A rebuttal that attacked nothing is a
  // side talking to itself, which is the softness this whole tool exists to make
  // visible without reading a word. Only rebuttals carry the "sepi" mark:
  // openings are blind by design and cross-exam answers reply to a question.
  let chip = '';
  const att = t.attacks || [];
  if (att.length) {
    chip = `<div class="chips">${att.map(id => `<span class="chip">→ menyerang ${esc(id)}</span>`).join('')}</div>`;
  } else if (t.phase === 'Rebuttal') {
    chip = `<div class="chips"><span class="chip sepi">→ tidak menyerang klaim mana pun</span></div>`;
  }

  return `<div class="turn ${cls}"><div class="turnhead">${audioBtn(t.index)}</div>
    ${w}<div class="text">${esc(t.text)}</div>
    ${chip}<div class="foot">${t.word_count} kata${t.truncated?' · terpotong':''}</div></div>`;
}

// Read-aloud control (aksesibilitas). One button per turn, top corner. It is a
// convenience for the ear, not a signal: nothing here plays on its own and there
// is no summary voice — you press it for the turn you want (§1). Voices differ by
// side server-side, so Pro and Kontra sound distinct without the screen (§7).
//
// State lives in `audioState` (keyed by turn index), NOT in the DOM, so it
// survives the live re-render that rebuilds #body on every SSE turn — the button
// redraws in the right state instead of resetting. The actual <audio> is the one
// persistent #player outside #body, so playback never cuts out on re-render and
// one turn can keep playing while another is generated.
const audioState = new Map();   // index -> 'menyiapkan' | 'siap' | 'gagal'
let loadedIndex = null;         // which turn is loaded in the player (playing OR paused)
let lastAudioErr = '';

function audioBtn(index) {
  const st = audioState.get(index);
  const player = document.getElementById('player');
  const loaded = loadedIndex === index;
  let label = '🔊 dengar', extra = '', cls = '';
  if (st === 'menyiapkan') { label = '⏳ menyiapkan…'; extra = ' disabled'; }
  else if (loaded) {
    // This turn is in the player: the button is a pause/resume toggle, so a
    // distraction never forces a refresh-and-restart — pausing keeps the spot.
    cls = ' aktif';
    label = (player && !player.paused) ? '⏸ jeda' : '▶ lanjut';
  }
  else if (st === 'siap')  { label = '🔊 putar lagi'; }
  else if (st === 'gagal') { label = '🔊 coba lagi'; }
  const err = st === 'gagal' && lastAudioErr ? `<span class="audio-err">${esc(lastAudioErr)}</span>` : '';
  return `<span class="audioslot"><button class="audiobtn${cls}"${extra} onclick="dengarTurn(${index})">${label}</button>${err}</span>`;
}

async function dengarTurn(index) {
  const player = document.getElementById('player');
  // Already loaded in the player → toggle pause/resume. Never re-set src here, so
  // resume continues from the current position instead of starting over.
  if (loadedIndex === index) {
    if (player.paused) player.play().catch(() => {}); else player.pause();
    return;   // the play/pause events re-render the button
  }
  // Prepared but a different turn is (or nothing is) loaded → load and play from
  // the start. No request: the file is cached.
  if (audioState.get(index) === 'siap') { mainkan(index); return; }
  // Guard: a second click while the first request is in flight does nothing, so
  // rapid clicks never fan out into duplicate POSTs (the server is idempotent
  // anyway, but this avoids the round-trips entirely).
  if (audioState.get(index) === 'menyiapkan') return;

  audioState.set(index, 'menyiapkan');
  render();   // reflect the ⏳ state; other turns keep playing untouched
  try {
    // POST returns immediately: the server generates in the background so no
    // single request outlives Cloudflare's edge timeout (that was the 524). A
    // cached turn comes back 'siap' at once; otherwise we poll for it.
    const r = await fetch('/api/sesi/' + id + '/audio/' + index, { method: 'POST' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('gagal ' + r.status)); }
    const j = await r.json().catch(() => ({}));
    if (j.status === 'siap') { audioState.set(index, 'siap'); mainkan(index); }
    else pollAudio(index);   // 'menyiapkan' — watch until the WAV is ready
  } catch (e) {
    audioState.set(index, 'gagal');
    lastAudioErr = e.message;
    render();
  }
}

// Watch one turn's background generation until it is ready or fails. Per-index
// and independent, so several turns can generate at once (the persistent player
// keeps one playing while others prepare). `audioState` is the source of truth:
// if the user closed or switched away, the guard below stops the loop quietly.
async function pollAudio(index) {
  if (audioState.get(index) !== 'menyiapkan') return;   // user moved on
  try {
    const r = await fetch('/api/sesi/' + id + '/audio/' + index + '/status');
    const j = await r.json().catch(() => ({}));
    if (j.status === 'siap') { audioState.set(index, 'siap'); mainkan(index); return; }
    if (j.status === 'gagal') { audioState.set(index, 'gagal'); lastAudioErr = j.error || 'gagal'; render(); return; }
    // 'belum' means the server has no job (e.g. it restarted) — kick off a fresh
    // generation, then keep polling. 'menyiapkan' just waits.
    if (j.status === 'belum') { await fetch('/api/sesi/' + id + '/audio/' + index, { method: 'POST' }); }
  } catch (e) {
    // A transient poll failure should not kill playback — try again next tick.
  }
  setTimeout(() => pollAudio(index), 1500);
}

// Point the one persistent player at a turn and play it from the start. Called
// only when switching to a different turn; pause/resume of the *same* turn never
// comes through here (see dengarTurn), so a resume never resets the position.
function mainkan(index) {
  const bar = document.getElementById('playerbar');
  const player = document.getElementById('player');
  const label = document.getElementById('playerlabel');
  const t = turns.get(index);
  const sisi = t ? ({pro:'Pro', kontra:'Kontra', moderator:'Moderator', sintesis:'Sintesis'}[t.side] || '') : '';
  label.textContent = sisi ? `${sisi}` : '';
  player.src = '/api/sesi/' + id + '/audio/' + index;
  bar.hidden = false;
  loadedIndex = index;
  player.play().catch(() => {});   // autoplay may be blocked; controls still work
  render();                        // update which button shows the pause toggle
}

function tutupPlayer() {
  const player = document.getElementById('player');
  player.pause();
  document.getElementById('playerbar').hidden = true;
  loadedIndex = null;
  render();
}

// The synthesis panel (§1): shut until the debate is done, and never runs by
// itself — the user opens it and clicks. Three states: locked (debate not
// finished), a run button (finished, no synthesis yet), or the rendered map of
// arguments (synthesis exists). It lives here and nowhere else; there is no
// summary at the top of the page.
function renderPanel() {
  const el = document.getElementById('sintesisisi');
  if (!el) return;
  const sint = [...turns.values()].find(t => t.side === 'sintesis');

  if (sint) {
    el.innerHTML = `<div class="turnhead">${audioBtn(sint.index)}</div>
      <div class="sintesis">${mdMini(sint.text)}</div>`;
    return;
  }
  if (meta.status !== 'selesai') {
    el.innerHTML = `<p class="muted">Panel ini sengaja tertutup sampai seluruh debat selesai,
      dan tidak terbuka sendiri. Kalau ringkasan muncul di atas, seluruh transkrip jadi hiasan.</p>`;
    return;
  }
  el.innerHTML = `<p class="muted">Debat selesai. Sintesis membaca seluruh transkrip lalu menyusun
    <em>peta argumen</em> — bukan pemenang, bukan skor. Jalankan saat kamu sudah membaca transkrip
    sendiri, bukan sebagai gantinya.</p>
    <button id="btnsintesis">Jalankan sintesis</button>
    <div id="sintesiserr" class="err" hidden></div>`;
  document.getElementById('btnsintesis').addEventListener('click', jalankanSintesis);
}

async function jalankanSintesis() {
  const btn = document.getElementById('btnsintesis');
  const err = document.getElementById('sintesiserr');
  err.hidden = true;
  btn.disabled = true;                       // guard against a double click
  btn.textContent = 'menjalankan sintesis…';
  try {
    const r = await fetch('/api/sesi/' + id + '/sintesis', { method: 'POST' });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ('gagal (' + r.status + ')'));
    }
    const turn = await r.json();
    turns.set(turn.index, turn);             // filtered out of the stream; only the panel reads it
    head();                                  // relight the strip: the Sintesis turn now exists
    renderPanel();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Jalankan sintesis';
    err.hidden = false;
    err.textContent = e.message;
  }
}

// Minimal markdown for the synthesis text — plain JS, no framework (§7). Handles
// only what synthesizer.md emits: ### headings, - bullets, **bold**, blank-line
// paragraphs. Everything is escaped before any tag is added, so model output
// cannot inject HTML.
function mdMini(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const lines = (src || '').split('\n');
  let out = '', list = false;
  const closeList = () => { if (list) { out += '</ul>'; list = false; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^#{1,6}\s+/.test(line)) {
      closeList();
      out += `<h4>${inline(line.replace(/^#{1,6}\s+/, ''))}</h4>`;
    } else if (/^[-*]\s+/.test(line)) {
      if (!list) { out += '<ul>'; list = true; }
      out += `<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`;
    } else if (line.trim() === '') {
      closeList();
    } else {
      closeList();
      out += `<p>${inline(line)}</p>`;
    }
  }
  closeList();
  return out;
}

function addTurn(t){ turns.set(t.index, t); render(); }

// Keep the card button in sync with the player: play/pause flip the toggle label
// (⏸ jeda ↔ ▶ lanjut) live, and when a turn finishes it stays loaded so the
// button reads "▶ lanjut" (a replay from the start), not a fresh "dengar".
(() => {
  const player = document.getElementById('player');
  ['play', 'pause', 'ended'].forEach(ev => player.addEventListener(ev, render));
})();

async function load() {
  const r = await fetch('/api/sesi/' + id);
  if (!r.ok) { document.getElementById('body').innerHTML = '<div class="err">Sesi tidak ditemukan.</div>'; return; }
  meta = await r.json();
  if (meta.status === 'menunggu_persetujuan') { location.href = '/sesi/' + id + '/framing'; return; }
  claims = meta.claims || [];
  (meta.turns||[]).forEach(addTurn);
  render();
  if (meta.status === 'berjalan') listen();
}

function listen() {
  // EventSource carries Last-Event-ID automatically on reconnect, so a dropped
  // connection resumes from the last turn seen — no missed or doubled turns.
  const es = new EventSource('/sesi/' + id + '/stream');
  es.addEventListener('turn', e => addTurn(JSON.parse(e.data)));
  es.addEventListener('klaim', e => { claims = JSON.parse(e.data); renderKlaim(); head(); });
  es.addEventListener('selesai', () => { es.close(); meta.status='selesai'; meta.status_label='selesai'; render(); });
  es.addEventListener('gagal', e => { es.close(); meta.status='gagal'; meta.status_label='berhenti — bisa dilanjutkan'; render(); });
}

load();
</script>
</body>
</html>
