<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting — Timbang</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js" defer></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timbang">
</head>
<body>
<header class="top"><div class="wrap">
  <h1><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="m"><rect width="100" height="100" rx="24"/></clipPath></defs><g clip-path="url(#m)"><rect width="100" height="100" fill="#1d4e6f"/><polygon points="100,0 100,100 0,100" fill="#7a2e2e"/><line x1="0" y1="100" x2="100" y2="0" stroke="#fff" stroke-width="7"/></g></svg><span>TIMBANG</span></h1>
  <nav><a href="/">Sidang baru</a><a href="/riwayat">Riwayat</a><a href="/setting">Setting</a><button id="tema" class="tema" type="button">☾ gelap</button></nav>
</div></header>

<div class="wrap">
  <h2>Setting</h2>
  <p class="muted">Ini mengubah <i>default</i> untuk sidang berikutnya. Base URL router dan
  API key tidak bisa diubah dari sini — satu kesalahan di situ bisa mengarahkan request
  beserta key ke server lain.</p>

  <div class="row" style="margin-top:8px">
    <button id="tes" class="ghost">Tes koneksi router</button>
    <span id="tesres" class="muted"></span>
  </div>

  <div id="form" class="notice">memuat…</div>
</div>

<script>
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

// Build one <select> for a role. `forbidCombo` disables combo-owned rows
// (§5 forbids them for Pro/Kontra: chained provider fallback would mis-attribute
// turns). Current value is added as a fallback option if the catalogue doesn't
// list it — an old sesi's model, or a typo, still round-trips through the form.
function opsiModel(id, models, current, forbidCombo) {
  const seen = new Set();
  const items = models.map(m => {
    seen.add(m.id);
    const bad = forbidCombo && m.owned_by === 'combo';
    const label = m.owned_by ? `${m.id}  [${m.owned_by}${bad ? ' — tidak untuk Pro/Kontra' : ''}]` : m.id;
    return `<option value="${esc(m.id)}"${m.id === current ? ' selected' : ''}${bad ? ' disabled' : ''}>${esc(label)}</option>`;
  });
  if (current && !seen.has(current)) {
    items.unshift(`<option value="${esc(current)}" selected>${esc(current)} (tidak ada di router)</option>`);
  }
  return `<select id="${id}">${items.join('')}</select>`;
}

async function load() {
  const [d, mRes] = await Promise.all([
    fetch('/api/setting').then(r => r.json()),
    fetch('/api/models').then(async r => {
      if (!r.ok) return { error: (await r.json()).error || 'gagal ambil daftar model' };
      return { models: await r.json() };
    }),
  ]);
  const modelsErr = mRes.error;
  const models = mRes.models || [];
  document.getElementById('form').className = '';
  document.getElementById('form').innerHTML = `
    <label>Base URL router (hanya baca)</label>
    <input type="text" value="${esc(d.base_url)}" disabled>
    ${modelsErr ? `<div class="err" style="margin-top:14px">Daftar model tidak bisa diambil: ${esc(modelsErr)}. Field model tetap bisa diketik.</div>` : ''}
    <label for="pro">Model Pro</label>${modelsErr
      ? `<input type="text" id="pro" value="${esc(d.models.pro)}">`
      : opsiModel('pro', models, d.models.pro, true)}
    <label for="kontra">Model Kontra</label>${modelsErr
      ? `<input type="text" id="kontra" value="${esc(d.models.kontra)}">`
      : opsiModel('kontra', models, d.models.kontra, true)}
    <label for="moderator">Model Moderator</label>${modelsErr
      ? `<input type="text" id="moderator" value="${esc(d.models.moderator)}">`
      : opsiModel('moderator', models, d.models.moderator, false)}
    <label for="synthesizer">Model Synthesizer</label>${modelsErr
      ? `<input type="text" id="synthesizer" value="${esc(d.models.synthesizer)}">`
      : opsiModel('synthesizer', models, d.models.synthesizer, false)}
    <label for="rounds">Jumlah ronde</label><input type="number" id="rounds" value="${d.rounds}" min="1" max="10">
    <label for="word_limit">Batas kata per giliran</label><input type="number" id="word_limit" value="${d.word_limit}" min="50" max="1000">
    <label for="temperature">Temperature</label><input type="number" id="temperature" value="${d.temperature}" min="0" max="2" step="0.1">
    <div id="err" class="err" style="display:none"></div>
    <div class="row">
      <button id="simpan">Simpan default</button>
      <button id="refresh" class="ghost" type="button">Muat ulang daftar model</button>
      <span id="ok" class="muted"></span>
    </div>`;
  document.getElementById('simpan').onclick = simpan;
  document.getElementById('refresh').onclick = async () => {
    await fetch('/api/models?refresh=1');
    document.getElementById('form').className = 'notice';
    document.getElementById('form').innerHTML = 'memuat…';
    load();
  };
}

async function simpan() {
  const err = document.getElementById('err'); err.style.display = 'none';
  const body = {
    models: {
      pro: val('pro'), kontra: val('kontra'),
      moderator: val('moderator'), synthesizer: val('synthesizer')
    },
    rounds: parseInt(val('rounds')),
    word_limit: parseInt(val('word_limit')),
    temperature: parseFloat(val('temperature'))
  };
  const r = await fetch('/api/setting', {
    method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error || 'gagal'; err.style.display = 'block'; return; }
  document.getElementById('ok').textContent = 'tersimpan';
  setTimeout(() => document.getElementById('ok').textContent = '', 2000);
}
function val(id){ return document.getElementById(id).value.trim(); }

document.getElementById('tes').onclick = async () => {
  const res = document.getElementById('tesres');
  res.textContent = 'menghubungi…';
  try {
    const d = await (await fetch('/api/sehat')).json();
    res.textContent = d.ok ? '✓ router hidup' : ('✗ ' + (d.pesan || 'tidak ok'));
    res.style.color = d.ok ? '#2b5e2b' : '#7a2e2e';
  } catch (e) { res.textContent = '✗ ' + e.message; res.style.color = '#7a2e2e'; }
};

load();
</script>
</body>
</html>
