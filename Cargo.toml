[package]
name = "timbang"
version = "0.1.0"
edition = "2024"

# One library, thin binaries (§2).
[lib]
name = "timbang"
path = "src/lib.rs"

[[bin]]
name = "uji"
path = "src/bin/uji.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"

[dependencies]
# Async from the start: bin/web needs it for SSE and background tasks (§7), and
# retrofitting it later would reshape every signature in llm and phase.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
axum = "0.8.9"
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures-util = "0.3.31"
async-stream = "0.3.6"
# "rustls" — the feature was renamed from "rustls-tls" in reqwest 0.13.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
# Timestamps must still parse years from now, so store them as RFC 3339 text.
jiff = { version = "0.2.34", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
thiserror = "2.0.19"
anyhow = "1.0.104"
