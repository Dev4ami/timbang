# Timbang. Committed — the API key is not here, it lives in .env (§6).

# LAN-langsung ke 9router di host yang sama, melewati tunnel Cloudflare.
# Alasan: TTS turn panjang butuh ~125s; Cloudflare depan 9router memutus di
# ~100s = 524/502. Lewat LAN batasnya jadi timeout klien Rust (300s), dan turn
# yang sama malah selesai ~54s tanpa overhead tunnel. Dipakai untuk SEMUA
# request (debat + TTS): §5 menyebut tunnel sebagai titik gagal tunggal.
# Bukan pelanggaran §6 — yang dilarang adalah web UI mengubah base_url, bukan
# file config yang di-commit. Server tetap bind loopback/guarded (lihat `bind`).
base_url = "http://192.168.0.100:20128"
# Loopback only. Binding wider would expose the server that holds the key (§6).
bind = "127.0.0.1:7878"

rounds = 3
word_limit = 220
temperature = 0.8
# Above this, a rebuttal counts as repeating its own previous turn (§4).
similarity_threshold = 0.55

prompts_dir = "prompts"
sessions_dir = "sesi"

[models]
# Pro and Kontra must come from different labs, at comparable tiers (§10): two
# models from one family share training data and fail together, and two tiers of
# one family produce a lopsided debate, which misleads worse than a soft one.
pro = "cc/claude-opus-4-7"
kontra = "kr/deepseek-3.2"
# The moderator only frames and nudges, so its provenance matters less. On the
# kr/ route because cc/claude-haiku-4-5-20251001 began rejecting requests with
# "authentication style incompatible with the long context beta header" — a cc/
# quirk that does not touch cc/claude-opus-4-7.
moderator = "kr/claude-haiku-4.5"
synthesizer = "cc/claude-opus-4-7"
# Runs after Crux to classify claims (faktual/opini) and cross-check the
# faktual ones. §1 forbids using the result as a winner signal — it flags
# "check this yourself", nothing more. Opus for the same reason synthesizer is
# on it: fact-check catatan lands in front of the user, so quality matters.
fact_checker = "cc/claude-opus-4-7"

[tts]
# Read-aloud voices (aksesibilitas). On-demand per turn, never a broadcast and
# never a signal (§1). Different voices per side so the ear tells Pro from Kontra
# without the screen (§7); they must be comparable in authority (§10), not one
# weightier. Model path is the router's TTS model *without* the voice; the voice
# is appended as the final segment (e.g. .../Zephyr). Router returns WAV.
model = "gemini/gemini-3.1-flash-tts-preview"
voice_pro = "Zephyr"
voice_kontra = "Puck"
voice_lain = "Charon"
